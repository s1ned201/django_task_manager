{% extends "base.html" %}

{% block title %}Task list{% endblock %}

{% block content %}


<table class="table">
  <thead>
    <tr>
      <th scope="col">Task Name</th>
      <th scope="col">Tags</th>
      <th scope="col">Status</th>
      <th scope="col">Priority</th>
    </tr>
  </thead>
  <tbody>
  {% for task in tasks %}
    <tr>
      <td>{{ task.name}}</td>
      <td>
        {% for tag in task.tags.all %}
        {{ tag.name}}
        {% endfor %}
      </td>
      <td>{{ task.status}}</td>
      <td>{{ task.priority}}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>


{% endblock %}
