{% extends "base.html" %}

{% block title %}Users list{% endblock %}

{% block content %}


<table class="table">
  <thead>
    <tr>
      <th scope="col">Name</th>
      <th scope="col">Age</th>
    </tr>
  </thead>
  <tbody>
  {% for user in users %}
    <tr>
      <td>{{ user.name}}</td>
      <td>{{ user.age}}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>


{% endblock %}
